name: bake-ghcr

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: bake-ghcr
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/avocahdoe/ocr-worker:1.0
          platforms: linux/amd64
          provenance: false
          sbom: false
