name: bake-ghcr

on:
  workflow_dispatch:
    inputs:
      target:
        description: overlay copies src onto 1.0; base rebuilds CUDA+Paddle
        type: choice
        options:
          - overlay
          - base
        default: overlay
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/entrypoint.sh
      - Dockerfile.runpod
      - .github/workflows/bake-ghcr.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: bake-ghcr
  cancel-in-progress: false

jobs:
  overlay:
    if: github.event_name == 'push' || github.event.inputs.target != 'base'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          push: true
          tags: ghcr.io/avocahdoe/ocr-worker:1.5
          platforms: linux/amd64
          provenance: false
          sbom: false

  base:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'base'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/avocahdoe/ocr-worker:1.0
          platforms: linux/amd64
          provenance: false
          sbom: false
